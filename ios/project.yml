name: DeepChat
options:
  bundleIdPrefix: com.deepchat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 编译时把本机绝对路径换掉：二进制里不留作者工程目录路径。
    OTHER_SWIFT_FLAGS: "-file-prefix-map $(SRCROOT)=/"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  DeepChatCore:
    type: framework
    info:
      path: Config/DeepChatCore-Info.plist
      properties:
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        CFBundlePackageType: FMWK
    platform: iOS
    sources:
      - path: Sources/DeepChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepchat.hulibuld.core
        PRODUCT_NAME: DeepChatCore
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  DeepChatUI:
    type: framework
    info:
      path: Config/DeepChatUI-Info.plist
      properties:
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        CFBundlePackageType: FMWK
    platform: iOS
    sources:
      - path: Sources/DeepChatUI
    dependencies:
      - target: DeepChatCore
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepchat.hulibuld.ui
        PRODUCT_NAME: DeepChatUI
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  DeepChat:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - target: DeepChatUI
      - target: DeepChatCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DeepChat
        CFBundleName: DeepChat
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: "把你说的话转成文字填进输入框，音频不留存"
        NSMicrophoneUsageDescription: "按住说话时录音，仅用于转写"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepchat.hulibuld
        PRODUCT_NAME: DeepChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"